<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · NICOLAS MARTINEZ</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Rajdhani:wght@600;700&family=Barlow:wght@300;400&family=Fira+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portfolio.css">

  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:2rem; }
    .e404-wrap { position:relative; z-index:2; max-width:520px; }
    .e404-mark { display:block; width:96px; height:96px; margin:0 auto 2.5rem; filter:drop-shadow(0 0 10px rgba(236,185,57,.35)); }
    .e404-code {
      font-family:var(--font-display); font-weight:900;
      font-size:clamp(64px, 14vw, 120px); line-height:.9;
      letter-spacing:-.02em; color:var(--text-hi); margin-bottom:.5rem;
    }
    .e404-code em { font-style:normal; color:var(--blue); }
    .e404-msg { font-size:16px; color:var(--text-mid); margin-bottom:2.5rem; line-height:1.6; }
    .e404-msg .sub { display:block; font-size:13px; color:var(--text-lo); margin-top:.5rem; }
    .e404-cta { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  </style>
</head>
<body>

  <div class="e404-wrap">
    <img class="e404-mark" src="pinza-mark.svg" alt="" aria-hidden="true">

    <p class="hero-eyebrow" style="justify-content:center;">// ERROR</p>
    <h1 class="e404-code">4<em>0</em>4</h1>
    <p class="e404-msg" id="e404-msg">
      Esta página no existe o se movió de lugar.
      <span class="sub" id="e404-sub">This page doesn't exist or moved elsewhere.</span>
    </p>

    <div class="e404-cta">
      <a href="index.html" class="btn btn-blue" id="e404-home">VOLVER AL INICIO</a>
      <a href="index.html#work" class="btn btn-ghost" id="e404-work">VER PROYECTOS</a>
    </div>
  </div>

  <script>
    (function () {
      var lang = 'es';
      try { lang = localStorage.getItem('nm_lang') || 'es'; } catch (e) {}
      if (lang === 'en') {
        document.documentElement.lang = 'en';
        document.getElementById('e404-msg').firstChild.textContent = "This page doesn't exist or moved elsewhere.";
        document.getElementById('e404-sub').textContent = 'Esta página no existe o se movió de lugar.';
        document.getElementById('e404-home').textContent = 'BACK TO HOME';
        document.getElementById('e404-work').textContent = 'VIEW PROJECTS';
      }
    })();
  </script>

</body>
</html>
